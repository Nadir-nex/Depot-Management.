<div class="dlv">
  <div class="dlv-head">
    <div>
      <h1>شحنة التوصيل</h1>
      <p class="muted">شحنة = سائق + مركبة + تاريخ + توقفات زبائن + طلبيات</p>
    </div>
    <div class="dlv-actions">
      <button id="d-btn-add" class="btn primary">＋ شحنة توصيل</button>
    </div>
  </div>

  <div class="cards">
    <div class="card clickable active" id="d-card-all"><div class="card-label">كل الشحنات</div><div class="card-val" id="d-stat-all">—</div></div>
    <div class="card clickable" id="d-card-planned"><div class="card-label">مخططة</div><div class="card-val" id="d-stat-planned">—</div></div>
    <div class="card clickable" id="d-card-progress"><div class="card-label">قيد التوصيل</div><div class="card-val" id="d-stat-progress">—</div></div>
    <div class="card clickable" id="d-card-done"><div class="card-label">مكتملة</div><div class="card-val" id="d-stat-done">—</div></div>
  </div>

  <div class="toolbar">
    <input id="d-filter-date" type="date" dir="ltr" title="تاريخ الشحنة" />
    <select id="d-filter-district"><option value="">كل الأحياء</option></select>
    <button id="d-btn-refresh" class="btn ghost">تحديث</button>
  </div>

  <div class="table-wrap">
    <table class="tbl">
      <thead>
        <tr>
          <th>رقم الشحنة</th>
          <th>التاريخ</th>
          <th>الحي الرئيسي</th>
          <th>السائق</th>
          <th>المركبة</th>
          <th>توقفات</th>
          <th>طلبات</th>
          <th>الحالة</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="d-body"></tbody>
    </table>
  </div>

  <!-- Create modal -->
  <div id="d-modal" class="modal hidden">
    <div class="modal-box wide">
      <h3>شحنة توصيل جديدة</h3>
      <div class="grid2">
        <label>التاريخ<input id="d-f-date" type="date" dir="ltr" /></label>
        <label>الحي الرئيسي (اختياري)<select id="d-f-district"><option value="">— بدون —</option></select></label>
      </div>
      <div class="grid2">
        <label>السائق<select id="d-f-driver"></select></label>
        <label>المركبة<select id="d-f-vehicle"></select></label>
      </div>
      <div class="c-label">الطلبيات (مؤكدة/منتظرة فقط)</div>
      <div class="row">
        <input id="d-order-search" placeholder="ابحث باسم الزبون أو رقم الطلبية…" />
      </div>
      <div id="d-order-results"></div>
      <div class="c-label">المختارة (<span id="d-sel-count">0</span>)</div>
      <div id="d-selected"></div>
      <div class="warnbox hidden" id="d-warn"></div>
      <div class="row">
        <button id="d-btn-create" class="btn primary">إنشاء الشحنة</button>
        <button class="btn ghost close-modal" data-close="d-modal">إلغاء</button>
      </div>
      <p class="err" id="d-err"></p>
    </div>
  </div>

  <!-- Edit planning modal -->
  <div id="d-modal-edit" class="modal hidden">
    <div class="modal-box">
      <h3>تعديل الشحنة المخططة</h3>
      <div class="grid2">
        <label>التاريخ<input id="d-e-date" type="date" dir="ltr" /></label>
        <label>الحي الرئيسي<select id="d-e-district"><option value="">— بدون —</option></select></label>
      </div>
      <div class="grid2">
        <label>السائق<select id="d-e-driver"></select></label>
        <label>المركبة<select id="d-e-vehicle"></select></label>
      </div>
      <div class="row">
        <button id="d-e-save" class="btn primary">حفظ</button>
        <button class="btn ghost close-modal" data-close="d-modal-edit">إلغاء</button>
      </div>
      <p class="err" id="d-e-err"></p>
    </div>
  </div>

  <!-- Detail workspace -->
  <div id="d-modal-detail" class="modal hidden">
    <div class="modal-box wide">
      <div id="d-detail"></div>
      <div class="row" id="d-detail-actions"></div>
      <p class="err" id="d-detail-err"></p>
      <div class="row"><button class="btn ghost close-modal" data-close="d-modal-detail">إغلاق</button></div>
    </div>
  </div>
</div>
