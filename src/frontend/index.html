<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depot — إدارة المستودع</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#view">Skip / تخطي</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary">
      <div class="side-brand">
        <span class="side-logo" aria-hidden="true">📦</span>
        <span class="side-name" id="brand-name">المستودع</span>
      </div>
      <nav id="nav" aria-label="Sections"></nav>
      <div class="side-foot">
        <div class="transport" id="transport">…</div>
      </div>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <button id="nav-toggle" class="icon-btn" aria-label="Menu" aria-expanded="true">☰</button>
        <div class="search-wrap">
          <span aria-hidden="true">🔎</span>
          <input id="global-search" type="search" autocomplete="off" aria-label="بحث المنتجات / Recherche articles" />
        </div>
        <div class="top-actions">
          <span id="route-title" class="route-title" role="status"></span>
          <select id="lang-sel" class="lang-sel" aria-label="Langue / اللغة">
            <option value="ar">العربية</option>
            <option value="fr">Français</option>
          </select>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="dialog-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
