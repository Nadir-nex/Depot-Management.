<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة المستودع — النسخة الجديدة</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">📦 المستودع <span class="sub">v0.2 — product + stock receipt slice</span></div>
      <div class="transport" id="transport">…</div>
    </header>
    <main class="grid">
      <section class="card">
        <h2>منتج جديد</h2>
        <form id="product-form">
          <label>SKU<input name="sku" required maxlength="64" placeholder="مثلا: SUGAR-1KG" /></label>
          <label>الاسم<input name="name" required maxlength="200" placeholder="مثلا: سكر 1كغ" /></label>
          <label>باركود (اختياري)<input name="barcode" maxlength="64" /></label>
          <label>التكلفة الافتراضية (سنتيم)<input name="defaultUnitCost" inputmode="numeric" value="0" /></label>
          <button type="submit">إنشاء المنتج</button>
        </form>
        <div class="msg" id="product-msg"></div>
      </section>
      <section class="card">
        <h2>استلام مخزون (سند شراء)</h2>
        <form id="receipt-form">
          <label>المورّد<input name="supplierName" maxlength="200" placeholder="مثلا: مورّد الجملة" /></label>
          <label>SKU المنتج<input name="sku" required placeholder="مثلا: SUGAR-1KG" /></label>
          <label>الكمية<input name="qty" required inputmode="numeric" value="10" /></label>
          <label>تكلفة الوحدة (سنتيم)<input name="unitCost" inputmode="numeric" value="0" /></label>
          <button type="submit">استلام</button>
        </form>
        <div class="msg" id="receipt-msg"></div>
      </section>
      <section class="card wide">
        <h2>المخزون (مشتق من حركات حقيقية)</h2>
        <div class="row">
          <button id="refresh" type="button">تحديث</button>
          <span class="hint">stock = SUM(stock_movements.qty)</span>
        </div>
        <table>
          <thead><tr><th>SKU</th><th>المنتج</th><th>المخزون</th></tr></thead>
          <tbody id="stock-body"><tr><td colspan="3">…</td></tr></tbody>
        </table>
      </section>
      <section class="card wide">
        <h2>آخر سندات الاستلام</h2>
        <table>
          <thead><tr><th>رقم السند</th><th>المورّد</th><th>الحالة</th><th>التاريخ</th></tr></thead>
          <tbody id="receipts-body"><tr><td colspan="4">…</td></tr></tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
