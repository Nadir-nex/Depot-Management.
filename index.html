<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة المستودع</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="modules/inventory/inventory.css" />
  <link rel="stylesheet" href="modules/customers/customers.css" />
  <link rel="stylesheet" href="modules/orders/orders.css" />
  <link rel="stylesheet" href="modules/staff/staff.css" />
  <link rel="stylesheet" href="modules/deliveries/deliveries.css" />
  <link rel="stylesheet" href="modules/warnings/warnings.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar on RIGHT because RTL -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">📦</div>
        <div>
          <div class="brand-title">المستودع</div>
          <div class="brand-sub">Depot Management</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-btn active" data-module="inventory">📋 المخزون</button>
        <button class="nav-btn" data-module="customers">👥 الزبائن</button>
        <button class="nav-btn" data-module="orders">🧾 الطلبيات</button>
        <button class="nav-btn" data-module="staff">👷 الموظفون والمركبات</button>
        <button class="nav-btn" data-module="deliveries">🚚 شحنة التوصيل</button>
        <button class="nav-btn" data-module="export">💾 تصدير قاعدة البيانات</button>
      </nav>

      <div class="sidebar-foot">
        <div class="warn-box" id="side-warnings">
          <div class="warn-title">التنبيهات</div>
          <div class="warn-row sev-danger" data-sev="danger" title="عرض المشاكل الحرجة">🔴 <strong id="w-danger">—</strong> مشاكل حرجة</div>
          <div class="warn-row sev-warn" data-sev="warn" title="عرض ما يحتاج مراجعة">🟠 <strong id="w-warn">—</strong> تحتاج مراجعة</div>
          <div class="warn-row sev-info" data-sev="info" title="عرض المعلومات">🔵 <strong id="w-info">—</strong> معلومات</div>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <div id="module-root"></div>
    </main>
  </div>

  <script src="modules/inventory/inventory.js"></script>
  <script src="modules/customers/customers.js"></script>
  <script src="modules/orders/orders.js"></script>
  <script src="modules/staff/staff.js"></script>
  <script src="modules/deliveries/deliveries.js"></script>
  <script src="modules/warnings/warnings.js"></script>
  <script>
    const root = document.getElementById('module-root');
    const btns = document.querySelectorAll('.nav-btn');

    const comingSoon = (name) => `
      <div class="soon">
        <h2>${name}</h2>
        <p>هذا القسم يأتي لاحقاً.</p>
      </div>`;

    const names = {
      customers: 'الزبائن', orders: 'الطلبيات',
      staff: 'الموظفون والمركبات', deliveries: 'شحنة التوصيل'
    };

    function load(module) {
      if (module === 'export') { exportDatabase(); return; }
      btns.forEach(b => b.classList.toggle('active', b.dataset.module === module));
      if (module === 'inventory') {
        window.InventoryModule.mount(root);
      } else if (module === 'customers') {
        window.CustomersModule.mount(root);
      } else if (module === 'orders') {
        window.OrdersModule.mount(root);
      } else if (module === 'staff') {
        window.StaffModule.mount(root);
      } else if (module === 'deliveries') {
        window.DeliveryModule.mount(root);
      } else {
        root.innerHTML = comingSoon(names[module] || module);
      }
      if (window.WarningsWidget) window.WarningsWidget.refresh();
    }
    window.__loadModule = load;

    btns.forEach(b => b.addEventListener('click', () => load(b.dataset.module)));
    load('inventory');

    let toastTimer = null;
    function toast(msg, kind) {
      let el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.className = 'show ' + (kind || 'ok');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.className = ''; }, 4000);
    }

    async function exportDatabase() {
      try {
        const r = await window.api.exportDatabase();
        if (r && r.canceled) toast('أُلغي التصدير — لم يتم حفظ أي ملف.', 'info');
        else if (r && r.ok) toast('تم تصدير قاعدة البيانات بنجاح.', 'ok');
        else toast('فشل التصدير: ' + ((r && r.error) || 'خطأ غير معروف'), 'err');
      } catch (e) {
        toast('فشل التصدير: ' + e.message, 'err');
      }
    }
  </script>
</body>
</html>
